<script>
(function(){
var LAUNCH=Date.UTC(2026,10,4,23,0,0); // Nov 4 2026 3:00 PM PST = 23:00 UTC
function $(id){return document.getElementById(id)}
function safe(name,fn){try{fn()}catch(e){if(window.console)console.warn('['+name+'] failed:',e)}}
var confetti=function(){};
// 1) COUNTDOWN FIRST
var opened=false,last={};
function pad(n){return n<10?'0'+n:''+n}
function set(id,v){var el=$(id);if(last[id]===v)return;last[id]=v;el.textContent=v;el.classList.remove('flip');void el.offsetWidth;el.classList.add('flip')}
function tick(){var t=Math.max(0,LAUNCH-Date.now());
set('d',''+Math.floor(t/864e5));set('h',pad(Math.floor(t/36e5)%24));set('m',pad(Math.floor(t/6e4)%60));set('s',pad(Math.floor(t/1e3)%60));
if(t===0&&!opened){opened=true;$('open').classList.add('show');try{confetti()}catch(e){}}}
safe('countdown',function(){tick();setInterval(tick,250)});
// 2) TIMES (no dateStyle+timeZoneName combo: Safari/Chrome throw on it)
function fmt(tz){var o={weekday:'long',year:'numeric',month:'long',day:'numeric',hour:'numeric',minute:'2-digit',timeZoneName:'short'};if(tz)o.timeZone=tz;
try{return new Intl.DateTimeFormat(undefined,o).format(new Date(LAUNCH))}catch(e){return new Date(LAUNCH).toString()}}
safe('times',function(){$('local').textContent=fmt();});
safe('et',function(){$('et').textContent=fmt('America/New_York')});
// 3) TIPS
safe('tips',function(){var tips=["Gnomes are not 'fun-sized.' They are 'efficiently engineered.'","Stormwind guards cannot help you find the auction house. Nobody can.","If you hear 'Leeroy', it is already too late.","Paladins: bubble first, ask questions never.","Dwarves recommend at least one ale per level. Healers disagree.","The Deeprun Tram is perfectly safe. Ignore the bubbles in the glass.","Night elves dance on mailboxes to boost morale. Science confirms it.","Pro tip: Horde players cannot read /say. Stand tall and wave anyway.","Goldshire Inn: rest XP is high, dignity is low.","Hogger is not a rite of passage. He is a lifestyle.","Remember to repair your armor. The King is not paying for that.","Draenei hooves are not for tap dancing. Mostly.","A true Alliance hero always asks, 'Has anyone seen my mount?'","Gryphons do not take tips. They take fingers."];
var ti=Math.floor(Math.random()*tips.length),e=$('tip');e.textContent=tips[ti];
setInterval(function(){e.style.opacity=0;setTimeout(function(){var n;do n=Math.floor(Math.random()*tips.length);while(n===ti);ti=n;e.textContent=tips[ti];e.style.opacity=1},500)},7000)});
// 4) EASTER EGG
safe('egg',function(){var c=0,ct;$('crest').addEventListener('click',function(){c++;clearTimeout(ct);ct=setTimeout(function(){c=0},2500);
if(c>=5){c=0;$('taunt').classList.add('show');setTimeout(function(){$('taunt').classList.remove('show')},2500)}})});

safe('horn',function(){var ac;$('horn').addEventListener('click',function(){try{var AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;ac=ac||new AC();if(ac.resume)ac.resume();var now=ac.currentTime;
var out=ac.createGain();out.gain.value=.25;var f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=1800;f.connect(out);out.connect(ac.destination);
[[0,.5,196],[.5,.35,261.6],[.85,1.3,329.6]].forEach(function(n){[1,2,3].forEach(function(h){var st=n[0],du=n[1],fr=n[2],o=ac.createOscillator(),g=ac.createGain();o.type='sawtooth';
o.frequency.setValueAtTime(fr*h*.97,now+st);o.frequency.linearRampToValueAtTime(fr*h,now+st+.08);
g.gain.setValueAtTime(0,now+st);g.gain.linearRampToValueAtTime(.4/h,now+st+.06);g.gain.setValueAtTime(.4/h,now+st+du-.1);g.gain.linearRampToValueAtTime(0,now+st+du);
o.connect(g);g.connect(f);o.start(now+st);o.stop(now+st+du+.05)})})}catch(e){}})});
// 6) PARALLAX
safe('parallax',function(){var ls=document.querySelectorAll('.layer');function up(){var y=window.pageYOffset||0;for(var i=0;i<ls.length;i++)ls[i].style.transform='translateY('+(y*parseFloat(ls[i].getAttribute('data-p')))+'px)'}
window.addEventListener('scroll',up,{passive:true});up()});
// 7) EMBERS + SPARKLES + CONFETTI
safe('fx',function(){var cv=$('fx'),cx=cv.getContext('2d'),W,H,dpr=Math.min(window.devicePixelRatio||1,2),parts=[],sp=[],conf=[];
function rs(){W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;cv.style.width=W+'px';cv.style.height=H+'px';cx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',rs);rs();
var N=W<600?40:70;function ember(){return{x:Math.random()*W,y:H+10,r:Math.random()*2.2+.6,vy:-(Math.random()*.8+.3),vx:(Math.random()-.5)*.4,a:Math.random()*.6+.4,ph:Math.random()*6}}
for(var i=0;i<N;i++){var e=ember();e.y=Math.random()*H;parts.push(e)}

for(i=0;i<18;i++){var s=spark();s.t=Math.random()*s.l;sp.push(s)}
confetti=function(){var c=['#e8be50','#fff0b0','#1d4bb0','#ffffff','#c8922a'];for(var i=0;i<260;i++)conf.push({x:W/2,y:H/2,vx:(Math.random()-.5)*16,vy:Math.random()*-16-2,s:Math.random()*6+4,c:c[i%5],r:Math.random()*6,life:200})};
function loop(){cx.clearRect(0,0,W,H);cx.globalCompositeOperation='lighter';
for(var i=0;i<parts.length;i++){var p=parts[i];p.ph+=.03;p.x+=p.vx+Math.sin(p.ph)*.3;p.y+=p.vy;if(p.y<-10)parts[i]=p=ember();

cx.globalCompositeOperation='source-over';conf=conf.filter(function(c){return c.life-->0});conf.forEach(function(c){c.vy+=.35;c.x+=c.vx;c.y+=c.vy;c.r+=.2;cx.save();cx.translate(c.x,c.y);cx.rotate(c.r);cx.fillStyle=c.c;cx.fillRect(-c.s/2,-c.s/4,c.s,c.s/2);cx.restore()});
requestAnimationFrame(loop)}loop()});
safe('test',function(){if(location.hash==='#test')setTimeout(function(){$('open').classList.add('show');confetti()},800)});
})();
