<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>WoW Forever Launch Countdown — For the Alliance!</title>

<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--blue:#0f2f78;--deep:#081a45;--gold:#e8be50;--gold2:#fff0b0;--parch:#f1e2b8}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{font-family:Cinzel,Georgia,serif;color:var(--parch);text-align:center;overflow-x:hidden;
background:radial-gradient(ellipse at top,#1d4bb0 0%,var(--blue) 40%,var(--deep) 100%);
background-color:var(--deep)}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.25;
background:repeating-linear-gradient(0deg,transparent 0 58px,rgba(0,0,0,.5) 58px 60px),repeating-linear-gradient(90deg,transparent 0 118px,rgba(0,0,0,.4) 118px 120px)}
canvas#embers{position:fixed;inset:0;pointer-events:none;z-index:1}
main{position:relative;z-index:2;max-width:960px;margin:auto;padding:24px 16px 60px}
#crest{width:150px;height:auto;cursor:pointer;filter:drop-shadow(0 0 18px rgba(232,190,80,.6));transition:transform .2s}
#crest:active{transform:scale(.94)}
h1{font-weight:900;color:var(--gold);font-size:clamp(2rem,7vw,4rem);margin:.2em 0;letter-spacing:.05em;text-shadow:0 3px 0 #5a3c08,0 0 25px rgba(232,190,80,.5)}
.badge{display:inline-block;padding:6px 16px;border:2px solid var(--gold);border-radius:4px;background:rgba(0,0,0,.3);color:var(--gold2);font-size:.95rem}
.clock{display:flex;justify-content:center;gap:clamp(6px,2vw,18px);margin:28px 0;flex-wrap:wrap}
.unit{background:linear-gradient(#6b6b72,#3c3d45);border:3px solid var(--gold);border-radius:8px;padding:14px 6px;min-width:clamp(70px,20vw,160px);box-shadow:inset 0 0 20px #000,0 6px 16px rgba(0,0,0,.6)}
.unit b{display:block;font-size:clamp(2.2rem,9vw,5rem);color:var(--gold2);text-shadow:0 0 12px rgba(232,190,80,.8)}
.unit span{font-size:clamp(.7rem,2.5vw,1rem);letter-spacing:.15em;color:var(--gold)}
.parch{color:#3b2a10;border-radius:6px;padding:16px 20px;margin:18px auto;max-width:640px;
background:radial-gradient(circle at 20% 30%,rgba(120,80,20,.18),transparent 40%),radial-gradient(circle at 80% 70%,rgba(120,80,20,.22),transparent 45%),linear-gradient(135deg,#f4e4bc,#e3c98d);
box-shadow:inset 0 0 30px rgba(110,70,20,.6),0 6px 18px rgba(0,0,0,.5)}
.parch p{margin:.35em 0}
#tip{min-height:3.2em;transition:opacity .5s;font-family:Georgia,serif;font-style:italic}
button{font-family:Cinzel,serif;font-weight:700;font-size:1.25rem;color:var(--deep);background:linear-gradient(var(--gold2),var(--gold));border:3px solid #7a5310;border-radius:6px;padding:14px 28px;cursor:pointer;box-shadow:0 4px 0 #7a5310}
button:active{transform:translateY(3px);box-shadow:0 1px 0 #7a5310}
#taunt,#open{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(0);z-index:5;transition:transform .3s;padding:24px 34px;border-radius:8px;font-size:clamp(1.5rem,6vw,3rem);font-weight:900}
#taunt{background:#5a0d0d;color:#ffcfb0;border:4px solid #2a0000}
#taunt.show,#open.show{transform:translate(-50%,-50%) scale(1)}
#open{background:var(--blue);color:var(--gold);border:4px solid var(--gold)}
footer{font-size:.75rem;opacity:.7;margin-top:30px;font-family:Georgia,serif}
footer a{color:var(--gold)}
</style></head><body>
<canvas id="embers"></canvas>
<main>
<svg id="crest" viewBox="0 0 200 240" aria-label="Lion crest" role="button">
<defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff0b0"/><stop offset="1" stop-color="#c8922a"/></linearGradient></defs>
<path d="M20 20h160v90c0 60-40 95-80 120C60 205 20 170 20 110z" fill="#123a96" stroke="url(#g)" stroke-width="10"/>
<path d="M40 40h120v68c0 45-30 72-60 92-30-20-60-47-60-92z" fill="none" stroke="#e8be50" stroke-width="2" opacity=".6"/>
<path d="M62 48l14 18 12-20 12 20 12-20 12 20 14-18-6 30H68z" fill="url(#g)"/>
<g fill="url(#g)"><path d="M100 82c-30 0-48 22-48 48 0 18 8 30 16 38l-8 22 22-10c6 3 12 4 18 4s12-1 18-4l22 10-8-22c8-8 16-20 16-38 0-26-18-48-48-48z"/></g>
<path d="M100 98c-18 0-28 14-28 32 0 16 12 30 28 30s28-14 28-30c0-18-10-32-28-32z" fill="#123a96"/>
<circle cx="89" cy="122" r="5" fill="#e8be50"/><circle cx="111" cy="122" r="5" fill="#e8be50"/>
<path d="M92 138h16l-8 8z" fill="#e8be50"/><path d="M90 150q10 6 20 0" stroke="#e8be50" stroke-width="3" fill="none"/>
</svg>
<h1>WoW Forever</h1>
<div class="badge">Official: Nov 4, 2026 · 3:00 PM PT</div>
<div class="clock" id="clock">
<div class="unit"><b id="d">--</b><span>DAYS</span></div><div class="unit"><b id="h">--</b><span>HOURS</span></div>
<div class="unit"><b id="m">--</b><span>MIN</span></div><div class="unit"><b id="s">--</b><span>SEC</span></div></div>
<div class="parch"><p><strong>Your time:</strong> <span id="local"></span></p><p><strong>Eastern (ET):</strong> <span id="et"></span></p></div>
<button id="horn">⚔ For the Alliance! ⚔</button>
<div class="parch"><p style="font-weight:700">Loading Screen Tip</p><p id="tip"></p></div>
<footer>Fan-made countdown. Not affiliated with Blizzard Entertainment. Launch time per <a href="https://news.blizzard.com/en-us/article/24301508/pre-purchase-world-of-warcraft-forever-upgrades-and-begin-your-next-journey-in-azeroth">Blizzard News</a>.</footer>
</main>
<div id="taunt">Lok'tar? <em>Never.</em></div>
<div id="open">The gates are open!</div>
<script>
const LAUNCH=Date.UTC(2026,10,4,23,0,0); // Nov 4 2026 3:00 PM PST = 23:00 UTC
const $=id=>document.getElementById(id);
const fmt=(tz)=>new Intl.DateTimeFormat(undefined,{dateStyle:'full',timeStyle:'short',timeZone:tz,timeZoneName:'short'}).format(LAUNCH);
$('local').textContent=fmt(undefined);$('et').textContent=fmt('America/New_York');
let opened=false;
function tick(){let t=Math.max(0,LAUNCH-Date.now());const p=n=>String(n).padStart(2,'0');
$('d').textContent=Math.floor(t/864e5);$('h').textContent=p(Math.floor(t/36e5)%24);$('m').textContent=p(Math.floor(t/6e4)%60);$('s').textContent=p(Math.floor(t/1e3)%60);
if(t===0&&!opened){opened=true;$('open').classList.add('show');confetti();}}
setInterval(tick,250);tick();
const tips=["Gnomes are not 'fun-sized.' They are 'efficiently engineered.'","Stormwind guards cannot help you find the auction house. Nobody can.","If you hear 'Leeroy', it is already too late.","Paladins: bubble first, ask questions never.","Dwarves recommend at least one ale per level. Healers disagree.","The Deeprun Tram is perfectly safe. Ignore the bubbles in the glass.","Night elves dance on mailboxes to boost morale. Science confirms it.","Pro tip: Horde players cannot read /say. Stand tall and wave anyway.","Goldshire Inn: rest XP is high, dignity is low.","Hogger is not a rite of passage. He is a lifestyle.","Remember to repair your armor. Varian is not paying for that.","Draenei hooves are not for tap dancing. Mostly.","A true Alliance hero always asks, 'Has anyone seen my mount?'","Gryphons do not take tips. They take fingers."];
let ti=Math.floor(Math.random()*tips.length);
function nextTip(){const e=$('tip');e.style.opacity=0;setTimeout(()=>{let n;do n=Math.floor(Math.random()*tips.length);while(n===ti);ti=n;e.textContent=tips[ti];e.style.opacity=1},500)}
$('tip').textContent=tips[ti];setInterval(nextTip,7000);
let clicks=0,ct;$('crest').addEventListener('click',()=>{clicks++;clearTimeout(ct);ct=setTimeout(()=>clicks=0,2500);
if(clicks>=5){clicks=0;$('taunt').classList.add('show');setTimeout(()=>$('taunt').classList.remove('show'),2500)}});
let ac;$('horn').addEventListener('click',()=>{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const now=ac.currentTime;
const out=ac.createGain();out.gain.value=.25;const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=1800;f.connect(out);out.connect(ac.destination);
[[0,.5,196],[.5,.35,261.6],[.85,1.3,329.6]].forEach(([st,du,fr])=>{[1,2,3].forEach(h=>{const o=ac.createOscillator(),g=ac.createGain();o.type='sawtooth';
o.frequency.setValueAtTime(fr*h*.97,now+st);o.frequency.linearRampToValueAtTime(fr*h,now+st+.08);
g.gain.setValueAtTime(0,now+st);g.gain.linearRampToValueAtTime(.4/h,now+st+.06);g.gain.setValueAtTime(.4/h,now+st+du-.1);g.gain.linearRampToValueAtTime(0,now+st+du);
o.connect(g);g.connect(f);o.start(now+st);o.stop(now+st+du+.05)})})});
const cv=$('embers'),cx=cv.getContext('2d');let W,H,parts=[];
function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight}addEventListener('resize',rs);rs();
const ember=()=>({x:Math.random()*W,y:H+10,r:Math.random()*2.5+.5,vy:-(Math.random()*.8+.3),vx:(Math.random()-.5)*.4,a:Math.random()*.6+.4,ph:Math.random()*6});
for(let i=0;i<70;i++){const e=ember();e.y=Math.random()*H;parts.push(e)}
let conf=[];function confetti(){const c=['#e8be50','#fff0b0','#1d4bb0','#ffffff','#c8922a'];for(let i=0;i<260;i++)conf.push({x:W/2,y:H/2,vx:(Math.random()-.5)*16,vy:Math.random()*-16-2,s:Math.random()*6+4,c:c[i%5],r:Math.random()*6,life:200})}
function loop(){cx.clearRect(0,0,W,H);parts.forEach((p,i)=>{p.ph+=.03;p.x+=p.vx+Math.sin(p.ph)*.3;p.y+=p.vy;if(p.y<-10)parts[i]=ember();
cx.beginPath();cx.fillStyle=`rgba(255,${180+Math.random()*50|0},80,${p.a})`;cx.shadowBlur=8;cx.shadowColor='#ffb030';cx.arc(p.x,p.y,p.r,0,7);cx.fill()});
cx.shadowBlur=0;conf=conf.filter(c=>c.life-->0);conf.forEach(c=>{c.vy+=.35;c.x+=c.vx;c.y+=c.vy;c.r+=.2;cx.save();cx.translate(c.x,c.y);cx.rotate(c.r);cx.fillStyle=c.c;cx.fillRect(-c.s/2,-c.s/4,c.s,c.s/2);cx.restore()});
requestAnimationFrame(loop)}loop();
if(location.hash==='#test'){setTimeout(()=>{$('open').classList.add('show');confetti()},800)}
</script></body></html>
